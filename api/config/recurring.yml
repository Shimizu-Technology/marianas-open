clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  schedule: every day at 3:12am

purge_unattached_blobs:
  class: PurgeUnattachedBlobsJob
  schedule: every Sunday at 4:20am

requeue_stale_event_gallery_images:
  class: RequeueStaleEventGalleryImagesJob
  schedule: every 5 minutes

complete_past_events:
  class: CompletePastEventsJob
  schedule: every 10 minutes

prune_asjjf_snapshots:
  class: PruneAsjjfSnapshotsJob
  schedule: every day at 4am

plan_results_sync:
  class: PlanResultsSyncJob
  schedule: every day at 3pm UTC
