name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marianas_open_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marianas_open_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      CI: "true"
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/marianas_open_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3.7"
          bundler-cache: true
          working-directory: api
      - name: Prepare test database
        run: bin/rails db:test:prepare
      - name: Run tests
        run: bin/rails test
      - name: Check Ruby style
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="HEAD^"
          fi
          mapfile -t ruby_files < <(
            git diff --diff-filter=ACMR --name-only "${base_sha}" HEAD -- '*.rb' '*.rake' Gemfile |
              sed 's#^api/##'
          )
          if (( ${#ruby_files[@]} > 0 )); then
            bin/rubocop "${ruby_files[@]}"
          else
            echo "No changed Ruby files to lint."
          fi
      - name: Audit Ruby dependencies
        run: bin/bundler-audit check --update
      - name: Scan Rails application
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="HEAD^"
          fi

          baseline_dir="$(mktemp -d)"
          baseline_report="${RUNNER_TEMP}/brakeman-base.json"
          cleanup() {
            git worktree remove --force "${baseline_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "${baseline_dir}" "${base_sha}"
          bin/brakeman --quiet --no-pager --path "${baseline_dir}/api" \
            --format json --output "${baseline_report}" \
            --no-exit-on-warn --exit-on-error
          bin/brakeman --quiet --no-pager --compare "${baseline_report}" \
            --exit-on-warn --exit-on-error

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check TypeScript and lint
        run: npm run lint
      - name: Build production frontend
        run: npm run build:no-translate

  staging-configuration:
    name: Staging configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          IMAGE_TAG: validation
          POSTGRES_PASSWORD: validation-only
          SECRET_KEY_BASE: validation-only
          CLERK_SECRET_KEY: sk_test_validation
        run: docker compose -f ops/staging/compose.yml config --quiet
      - name: Check deployment scripts
        run: bash -n ops/staging/*.sh
      - name: Build staging API image
        run: docker build --file api/Dockerfile --tag marianas-open-api:ci api
      - name: Build staging web image
        run: docker build --file web/Dockerfile --tag marianas-open-web:ci web
      - name: Validate staging Caddyfile
        run: >-
          docker run --rm --entrypoint caddy marianas-open-web:ci
          validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish-staging-images:
    name: Publish staging images
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs:
      - api
      - web
      - staging-configuration
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: marianas-open-api
            context: api
            file: api/Dockerfile
          - image: marianas-open-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/shimizu-technology/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/shimizu-technology/${{ matrix.image }}:staging
          build-args: |
            VITE_API_URL=
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}
